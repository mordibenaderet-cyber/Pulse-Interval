<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#090e18">
  <meta name="color-scheme" content="dark">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Pulse Interval">
  <meta name="description" content="בונים אימון. שומרים תוכנית. נכנסים לקצב. סטופר מקצועי לאימוני טאבטה, HIIT, כוח ועוד.">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="apple-touch-icon" href="./icon-192.png">
  <link rel="icon" href="./favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="./styles.css">
  <title>Pulse Interval — Smart Workout Timer</title>
</head>
<body>
  <svg class="svg-defs" aria-hidden="true" xmlns="http://www.w3.org/2000/svg">
    <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
    <symbol id="i-play" viewBox="0 0 24 24"><path d="m8 5 11 7-11 7V5Z" fill="currentColor" stroke="none"/></symbol>
    <symbol id="i-pause" viewBox="0 0 24 24"><path d="M8 5v14M16 5v14" stroke-width="3"/></symbol>
    <symbol id="i-arrow" viewBox="0 0 24 24"><path d="m14 6-6 6 6 6"/></symbol>
    <symbol id="i-chevron" viewBox="0 0 24 24"><path d="m15 6-6 6 6 6"/></symbol>
    <symbol id="i-next" viewBox="0 0 24 24"><path d="m5 5 9 7-9 7V5Zm12 0v14"/></symbol>
    <symbol id="i-previous" viewBox="0 0 24 24"><path d="m19 5-9 7 9 7V5ZM7 5v14"/></symbol>
    <symbol id="i-edit" viewBox="0 0 24 24"><path d="m14 5 5 5M4 20l4.7-1 10-10a2.1 2.1 0 0 0-3-3l-10 10L4 20Z"/></symbol>
    <symbol id="i-copy" viewBox="0 0 24 24"><rect x="8" y="8" width="12" height="12" rx="2"/><path d="M16 8V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h2"/></symbol>
    <symbol id="i-trash" viewBox="0 0 24 24"><path d="M4 7h16M10 4h4M6 7l1 13h10l1-13M10 11v5M14 11v5"/></symbol>
    <symbol id="i-time" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3.5 2"/></symbol>
    <symbol id="i-calendar" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M8 3v4M16 3v4M3 10h18"/></symbol>
    <symbol id="i-activity" viewBox="0 0 24 24"><path d="M3 13h4l3-8 4 14 3-6h4"/></symbol>
    <symbol id="i-dumbbell" viewBox="0 0 24 24"><path d="m6 6 12 12M3 7l4-4M17 21l4-4M2 10l8-8M14 22l8-8"/></symbol>
    <symbol id="i-settings" viewBox="0 0 24 24"><path d="M4 7h16M4 17h16M8 4v6M16 14v6"/></symbol>
    <symbol id="i-download" viewBox="0 0 24 24"><path d="M12 3v12m0 0 5-5m-5 5-5-5M4 17v3h16v-3"/></symbol>
    <symbol id="i-upload" viewBox="0 0 24 24"><path d="M12 17V5m0 0-5 5m5-5 5 5M4 17v3h16v-3"/></symbol>
    <symbol id="i-volume" viewBox="0 0 24 24"><path d="M5 9H2v6h3l5 4V5L5 9ZM14 9a4 4 0 0 1 0 6M17 6a8 8 0 0 1 0 12"/></symbol>
    <symbol id="i-check" viewBox="0 0 24 24"><path d="m4 12 5 5L20 6"/></symbol>
    <symbol id="i-up" viewBox="0 0 24 24"><path d="m6 14 6-6 6 6"/></symbol>
    <symbol id="i-down" viewBox="0 0 24 24"><path d="m6 10 6 6 6-6"/></symbol>
    <symbol id="i-close" viewBox="0 0 24 24"><path d="m5 5 14 14M19 5 5 19"/></symbol>
    <symbol id="i-refresh" viewBox="0 0 24 24"><path d="M20 7V3m0 4h-4M20 7a9 9 0 1 0 1 8"/></symbol>
    <symbol id="i-sparkle" viewBox="0 0 24 24"><path d="m12 2 2.3 7.7L22 12l-7.7 2.3L12 22l-2.3-7.7L2 12l7.7-2.3L12 2Z"/></symbol>
    <symbol id="i-info" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 8h.01"/></symbol>
  </svg>

  <header class="app-header">
    <div class="header-inner">
      <button type="button" class="brand" data-action="home" aria-label="חזרה למסך הראשי">
        <span class="brand-mark"><svg class="brand-graphic" viewBox="0 0 38 38" fill="none" aria-hidden="true"><circle cx="19" cy="19" r="15.5" stroke="currentColor" stroke-width="2.2" opacity=".5"/><path d="m7 20 8 0 3-8 4 15 3-7h6" stroke="currentColor" stroke-width="3.1" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
        <span class="brand-type"><strong>PULSE<span>INTERVAL</span></strong><small>TRAIN YOUR TIME</small></span>
      </button>
      <div class="header-side"><span class="header-live"><span class="live-dot"></span> FOCUS MODE</span><button type="button" class="header-add" data-action="new"><svg class="ic"><use href="#i-plus"/></svg><span>אימון חדש</span></button></div>
    </div>
  </header>

  <div class="shell">
    <nav class="main-nav" id="mainNav" aria-label="ניווט ראשי">
      <button data-page="home" class="nav-btn active"><svg class="ic"><use href="#i-activity"/></svg>התוכניות שלי</button>
      <button data-page="history" class="nav-btn"><svg class="ic"><use href="#i-calendar"/></svg>היסטוריה</button>
      <button data-page="settings" class="nav-btn"><svg class="ic"><use href="#i-settings"/></svg>הגדרות</button>
    </nav>
    <main id="view" tabindex="-1"></main>
    <footer class="app-footer" id="appFooter"><div class="footer-line"></div><span>DESIGNED &amp; DEVELOPED BY</span> <strong>Mordi Ben Aderet</strong><span class="footer-copyright">© 2026 PULSE INTERVAL</span></footer>
  </div>

  <div class="toast" role="status" aria-live="polite" id="toast"></div>
  <input type="file" id="backupPicker" accept=".json,application/json" hidden>
  <script src="./app.js" defer></script>
</body>
</html>
